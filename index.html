<body>
  <!-- Outer wrapper for PC centering -->
  <div class="page-shell">

    <!-- Full-page background (continuous, no break) -->
    <div class="page-bg" aria-hidden="true">
      <div class="page-bg__poster"></div>
      <div class="page-bg__gradient"></div>
    </div>

    <!-- Scroll container -->
    <div class="page-scroll" id="pageScroll">

      <!-- ═══════════════════════════════════════════ -->
      <!-- HERO: KV Title + Content                   -->
      <!-- ═══════════════════════════════════════════ -->
      <section class="hero">
        <div class="hero__inner">
          <!-- Top bar -->
          <header class="topbar">
            <div class="topbar__logo mono">LIM CHAE BIN</div>
            <img src="assets/heart.svg" alt="" class="topbar__heart" aria-hidden="true">
          </header>

          <!-- KV Title — 2 images stacked -->
          <div class="kv" id="kvSection">
            <img src="assets/kv-title-1.svg" alt="ENDLESS HORIZON" class="kv__title kv__title--1" id="kvTitle1">
            <img src="assets/kv-title-2.svg" alt="대원 10기 성우 임채빈" class="kv__title kv__title--2" id="kvTitle2">

        </div>
      </section>

      <!-- TABS: 음성 특전 / 밸런스 게임 (sticky)       -->
      <!-- ═══════════════════════════════════════════ -->
      <nav class="tabs" id="pageTabs" aria-label="페이지 탭">
        <div class="tabs__track" role="tablist">
          <span class="tabs__indicator" aria-hidden="true"></span>
          <button class="tabs__btn is-active" id="tabVoice" role="tab" aria-selected="true" aria-controls="panelVoice"
            data-tab="voice"><svg class="tabs__star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" />
            </svg><span>음성 특전</span></button>

            </svg><span>밸런스 게임</span></button>
        </div>
      </nav>

      <!-- ═══════════════════════════════════════════ -->
      <!-- TAB 1: 음성 특전 ~ 갤러리                    -->
      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-panel" id="panelVoice" role="tabpanel" aria-labelledby="tabVoice">
        <div class="hero__body">
          <!-- ═══════════════════════════════════ -->
          <!-- AUDIO PLAYER                       -->
          <!-- ═══════════════════════════════════ -->
          <div class="glass-card audio-card" id="audioCard">
            <div class="audio-card__top">
              <button class="audio-card__play" id="audioPlayBtn" aria-label="재생">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6,3 20,12 6,21" />
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="5" y="3" width="4" height="18" />
                  <rect x="15" y="3" width="4" height="18" />
                </svg>
              </button>
              <div class="audio-card__info">
                <div class="audio-card__name">채빈님 음성 특전 듣기</div>
                <div class="audio-card__status" id="audioStatus">PLAY NOW</div>
              </div>
              <div class="audio-card__time mono" id="audioTime">--:--</div>
            </div>
            <!-- Waveform bars -->
            <div class="waveform" id="waveform" aria-hidden="true"></div>
            <!-- 재생용 오디오: src는 main.js에서 지정 (jsDelivr CDN 우선, 실패 시 로컬 파일) -->
            <audio id="voiceAudio" preload="metadata" hidden></audio>
          </div>

          <!-- ═══════════════════════════════════ -->
          <!-- VIDEO DOWNLOAD                     -->
          <!-- ═══════════════════════════════════ -->
          <a href="assets/chaebin_voice_msg.mp3?download=1" download="chaebin_voice_msg.mp3" class="download-btn"
            id="downloadBtn">
            <span class="download-btn__label">채빈님 음성 특전 다운로드</span>
            <span class="download-btn__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 5v14M5 12l7 7 7-7" />
              </svg>
            </span>
          </a>

          <!-- ═══════════════════════════════════ -->
          <!-- LINK CARDS (YouTube / Fancafe / IG / X) -->
          <!-- ═══════════════════════════════════ -->
          <div class="link-grid">
            <a href="https://www.youtube.com/@%EC%84%B1%EC%9A%B0%EC%9E%84%EC%B1%84%EB%B9%88" target="_blank"

            <a href="https://cafe.naver.com/forchaebin" target="_blank" rel="noopener noreferrer"
              class="link-card link-card--fc" id="fcCard">
              <span class="link-card__tag mono"></span>
              <img src="assets/fancafe.png" alt="하늘정원" class="link-card__logo link-card__logo--fc">
              <span class="link-card__label">
                <span class="link-card__label-text">채빈님 팬카페</span>
                <span class="link-card__arrow">→</span>
              </span>
            </a>
            <a href="https://www.instagram.com/caebinlim/" target="_blank" rel="noopener noreferrer"

              <span class="link-card__label">
                <span class="link-card__label-text">채빈님 인스타그램</span>
                <span class="link-card__arrow">→</span>
              </span>
            </a>
            <a href="https://x.com/chebineee" target="_blank" rel="noopener noreferrer" class="link-card link-card--x"
              id="xCard">
              <span class="link-card__tag mono"></span>
              <img src="assets/x.svg" alt="X" class="link-card__logo link-card__logo--x">
              <span class="link-card__label">
                <span class="link-card__label-text">채빈님 X</span>
                <span class="link-card__arrow">→</span>
              </span>
            </a>
          </div>
        </div>

      <!-- ═══════════════════════════════════════════ -->
      <!-- GALLERY SECTION (semi-transparent bg)      -->
      <!-- ═══════════════════════════════════════════ -->

          <h2 class="gallery__title">Gallery</h2>

        </div>

        <div class="gallery__viewport" id="galleryViewport">
          <div class="gallery__track" id="galleryTrack">

        <div class="gallery__controls">
          <button class="gallery__arrow" id="galleryPrev" aria-label="이전">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <button class="gallery__arrow" id="galleryNext" aria-label="다음">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="9 6 15 12 9 18" />
            </svg>
          </button>
          <div class="gallery__progress">
            <div class="gallery__progress-fill" id="galleryProgress"></div>
          </div>
        </div>
      </section>

      <!-- ═══════════════════════════════════════════ -->

      <!-- ═══════════════════════════════════════════ -->
      <div class="tab-panel" id="panelBalance" role="tabpanel" aria-labelledby="tabBalance" hidden>
        <section class="balance" id="balanceSection">
          <header class="balance__header">
            <span class="balance__eyebrow mono">CHAEBIN'S CHOICE</span>
            <h2 class="balance__title">Balance Game</h2>
            <p class="balance__desc">둘 중 하나만 고른다면? 채빈님이 직접 고른 16가지 선택</p>
            <div class="balance__legend">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"

                  <circle cx="12" cy="12" r="9.5" />
                  <path d="M8 12.5l2.6 2.6L16 9.6" />

              <span class="balance__legend-text">표시가 채빈님의 선택이에요</span>

          </header>
          <div class="balance__list" id="balanceList">

      <!-- ═══════════════════════════════════════════ -->

      <!-- ═══════════════════════════════════════════ -->

          <span class="mono">© LIM CHAEBIN</span>
          <span class="mono">ENDLESS HORIZON · 2026</span>
        </div>
      </footer>

    <!-- ═══════════════════════════════════ -->
